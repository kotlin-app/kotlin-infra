apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-app
  namespace: kotori-market
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bff-app
  template:
    metadata:
      labels:
        app: bff-app
    spec:
      containers:
        - name: bff-app
          image: ghcr.io/kotlin-app/bff-app:latest
          ports:
            - containerPort: 8080
          env:
            - name: SERVICES_PRODUCT-URL
              value: http://product-service:8081
            - name: SERVICES_REVIEW-URL
              value: http://review-service:8082
            - name: REDIS_HOST
              value: redis
            - name: ZIPKIN_URL
              value: http://zipkin:9411
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: bff-app
  namespace: kotori-market
spec:
  selector:
    app: bff-app
  ports:
    - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bff-ingress
  namespace: kotori-market
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: api.kotori-market.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bff-app
                port:
                  number: 8080

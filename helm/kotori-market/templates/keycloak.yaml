apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: {{ .Values.namespace }}
data:
  kotori-market-realm.json: |
    {
      "realm": "{{ .Values.keycloak.realm }}",
      "enabled": true,
      "displayName": "Kotori Market",
      "roles": {
        "realm": [
          { "name": "USER",  "description": "一般ユーザー" },
          { "name": "ADMIN", "description": "管理者" }
        ]
      },
      "clients": [
        {
          "clientId": "bff-client",
          "enabled": true,
          "publicClient": false,
          "bearerOnly": true
        },
        {
          "clientId": "frontend-client",
          "enabled": true,
          "publicClient": true,
          "redirectUris": ["http://{{ .Values.bff.ingress.host }}/*"],
          "webOrigins": ["http://{{ .Values.bff.ingress.host }}"],
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true
        }
      ],
      "users": [
        {
          "username": "admin",
          "enabled": true,
          "credentials": [{ "type": "password", "value": "admin123", "temporary": false }],
          "realmRoles": ["USER", "ADMIN"]
        },
        {
          "username": "user",
          "enabled": true,
          "credentials": [{ "type": "password", "value": "user123", "temporary": false }],
          "realmRoles": ["USER"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: {{ .Values.namespace }}
  labels:
    app: keycloak
    {{- include "kotori-market.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args: ["start-dev", "--import-realm"]
          env:
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.keycloak.adminUser }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: {{ .Values.keycloak.adminPassword }}
          ports:
            - containerPort: {{ .Values.keycloak.port }}
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
          readinessProbe:
            httpGet:
              path: /realms/{{ .Values.keycloak.realm }}/.well-known/openid-configuration
              port: {{ .Values.keycloak.port }}
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-config
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
    - port: {{ .Values.keycloak.port }}
      nodePort: {{ .Values.keycloak.nodePort }}

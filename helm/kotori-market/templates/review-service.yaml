apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  namespace: {{ .Values.namespace }}
  labels:
    app: review-service
    {{- include "kotori-market.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.reviewService.replicas }}
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
    spec:
      containers:
        - name: review-service
          image: {{ .Values.imageRegistry }}/{{ .Values.reviewService.image }}:{{ .Values.reviewService.tag }}
          ports:
            - containerPort: {{ .Values.reviewService.port }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/reviewdb
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.postgres.username }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ .Values.postgres.password }}
            - name: ZIPKIN_URL
              value: http://zipkin:9411
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.reviewService.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.reviewService.port }}
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: review-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: review-service
  ports:
    - port: {{ .Values.reviewService.port }}

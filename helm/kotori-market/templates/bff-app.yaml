apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-app
  namespace: {{ .Values.namespace }}
  labels:
    app: bff-app
    {{- include "kotori-market.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.bff.replicas }}
  selector:
    matchLabels:
      app: bff-app
  template:
    metadata:
      labels:
        app: bff-app
    spec:
      containers:
        - name: bff-app
          image: {{ .Values.imageRegistry }}/{{ .Values.bff.image }}:{{ .Values.bff.tag }}
          ports:
            - containerPort: {{ .Values.bff.port }}
          env:
            - name: SERVICES_PRODUCT-URL
              value: http://product-service:{{ .Values.productService.port }}
            - name: SERVICES_REVIEW-URL
              value: http://review-service:{{ .Values.reviewService.port }}
            - name: SERVICES_ORDER-URL
              value: http://order-service:{{ .Values.orderService.port }}
            - name: REDIS_HOST
              value: redis
            - name: ZIPKIN_URL
              value: http://zipkin:9411
            - name: JWT_SECRET
              value: {{ .Values.bff.jwtSecret }}
            - name: KEYCLOAK_ISSUER_URI
              value: http://keycloak:{{ .Values.keycloak.port }}/realms/{{ .Values.keycloak.realm }}
            - name: SPRING_PROFILES_ACTIVE
              value: keycloak
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.bff.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.bff.port }}
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: bff-app
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: bff-app
  ports:
    - port: {{ .Values.bff.port }}
{{- if .Values.bff.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bff-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kotori-market.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: {{ .Values.bff.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bff-app
                port:
                  number: {{ .Values.bff.port }}
{{- end }}

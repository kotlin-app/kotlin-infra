namespace: kotori-market

imageRegistry: ghcr.io/kotlin-app

postgres:
  image: postgres:16-alpine
  username: postgres
  password: postgres
  storage: 1Gi

redis:
  image: redis:7.2-alpine

kafka:
  image: apache/kafka:3.7.1
  nodeId: "0"
  replicationFactor: "1"

zipkin:
  image: openzipkin/zipkin:3

prometheus:
  image: prom/prometheus:v2.53.0
  nodePort: 30090

grafana:
  image: grafana/grafana:11.1.0
  adminPassword: admin
  nodePort: 30300

productService:
  image: kotlin-product-service
  tag: latest
  replicas: 2
  port: 8081

reviewService:
  image: kotlin-review-service
  tag: latest
  replicas: 2
  port: 8082

orderService:
  image: kotlin-order-service
  tag: latest
  replicas: 2
  port: 8083

bff:
  image: bff-app
  tag: latest
  replicas: 2
  port: 8080
  jwtSecret: "bff-secret-key-must-be-at-least-256-bits-long-for-hs256"
  ingress:
    enabled: true
    host: api.kotori-market.local

keycloak:
  image: quay.io/keycloak/keycloak:25.0
  adminUser: admin
  adminPassword: admin
  port: 8080
  nodePort: 30180
  realm: kotori-market

frontend:
  image: nginx:1.27-alpine
  port: 8090
  nodePort: 30090
